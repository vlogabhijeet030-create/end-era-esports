<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Team - END ERA eSports</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<a class="logo" href="index.html">
END ERA <small>eSports</small>
</a>

<nav>
<a href="index.html">Home</a>
<a href="tournaments.html">Tournaments</a>
<a href="scrims.html">Scrims</a>
<a href="team.html">My Team</a>
<a href="results.html">Results</a>
<a href="login.html">Login</a>
</nav>

<button type="button" onclick="menu()">☰</button>
</header>

<main>

<section class="page">

<p class="gold">TEAM MANAGEMENT</p>

<h1>MY TEAM</h1>

<div class="card">

<h2>Create Team</h2>

<form id="teamForm">

<label>Team Name</label>
<input
id="teamName"
type="text"
placeholder="Enter team name"
required
>

<label>Captain Name</label>
<input
id="captain"
type="text"
placeholder="Enter captain name"
required
>

<label>Team Logo URL</label>
<input
id="logo"
type="text"
placeholder="Optional"
>

<button
type="submit"
class="btn full">
CREATE TEAM
</button>

</form>

</div>

<div class="card">

<h2>My Teams</h2>

<div id="myTeams">
Loading...
</div>

</div>

</section>

</main>

<footer>
END ERA eSports
</footer>

<script src="app.js"></script>

<script>

document.addEventListener("DOMContentLoaded",function(){

const user=getUser();

if(!user){
location.href="login.html";
return;
}

loadTeams();

const form=document.getElementById("teamForm");

form.addEventListener("submit",async function(e){

e.preventDefault();

const teamName=
document.getElementById("teamName").value.trim();

const captain=
document.getElementById("captain").value.trim();

const logo=
document.getElementById("logo").value.trim();

if(!teamName||!captain){
showMessage("Team name and captain name required.");
return;
}

const r=await createTeam(
user.userId,
teamName,
captain,
logo
);

showMessage(r.message||"Done");

if(r.ok){

form.reset();

loadTeams();

}

});

});

async function loadTeams(){

const user=getUser();

if(!user)return;

const box=document.getElementById("myTeams");

const r=await getMyTeams(user.userId);

if(!r.ok){

box.innerHTML="<p>Unable to load teams.</p>";
return;

}

const teams=r.teams||[];

if(!teams.length){

box.innerHTML="<p>No team created yet.</p>";
return;

}

box.innerHTML=teams.map(t=>`

<div class="card">

<h3>${escapeHtml(t.teamName)}</h3>

<p>
Captain: ${escapeHtml(t.captain||"")}
</p>

<p>
Team ID: ${escapeHtml(t.teamId)}
</p>

</div>

`).join("");

}

</script>

</body>
</html>
