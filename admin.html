<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>END ERA Admin</title>

<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#080c14;color:#e5e7eb;padding:16px}
.container{max-width:650px;margin:auto}
h1{margin:0;font-size:24px}
.subtitle{color:#94a3b8;margin:4px 0 20px}
.card{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:16px;color:#38bdf8;margin:0 0 14px}
label{display:block;font-size:12px;color:#94a3b8;margin:10px 0 5px}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #263244;background:#0b1220;color:white}
button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
.green{background:#16a34a}
.red{background:#dc2626}
.gray{background:#334155}
.yellow{background:#ca8a04}
.msg{display:none;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.success{display:block;background:#14532d;color:#86efac}
.error{display:block;background:#450a0a;color:#fca5a5}
.item{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-top:10px}
.item b{color:#38bdf8}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.smallbtn{width:auto;margin:0;padding:8px 12px;font-size:12px}
.status{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
.open{background:#14532d;color:#86efac}
.closed{background:#450a0a;color:#fca5a5}
.pending{color:#facc15}
.confirmed{color:#4ade80}
.rejected{color:#f87171}
.slot{font-size:20px;font-weight:800;margin:8px 0;color:#fff}
.muted{color:#64748b;font-size:13px}
</style>
</head>

<body>

<div class="container">

<h1>END ERA Admin</h1>
<p class="subtitle">Control Room • 12 Team System</p>

<!-- CREATE TOURNAMENT -->
<div class="card">

<h2>Create Tournament</h2>

<label>Tournament Name</label>
<input id="tName" placeholder="END ERA 12 TEAM SCRIM">

<label>Type</label>
<select id="tType">
<option value="Scrim">Scrim</option>
<option value="Tournament">Tournament</option>
<option value="Custom">Custom</option>
</select>

<label>Entry Fee</label>
<input id="tFee" placeholder="10">

<label>Prize</label>
<input id="tPrize" placeholder="120">

<label>Map</label>
<input id="tMap" placeholder="Bermuda">

<label>Match Time</label>
<input id="tTime" placeholder="10 Aug, 8:00 PM">

<button onclick="createTournament()">CREATE TOURNAMENT</button>

<div id="tMsg" class="msg"></div>

</div>


<!-- TOURNAMENT LIST -->
<div class="card">

<h2>Tournaments</h2>

<button class="gray" onclick="loadTournaments()">REFRESH</button>

<div id="tournamentList">
<p class="muted">Loading...</p>
</div>

</div>


<!-- REGISTRATIONS -->
<div class="card">

<h2>Team Registrations</h2>

<label>Tournament ID</label>
<input id="regTournamentId" placeholder="TNT_xxxxx">

<button onclick="loadRegistrations()">LOAD REGISTRATIONS</button>

<div id="slotCount" class="slot">
0 / 12 Teams
</div>

<div id="registrationList">
<p class="muted">Select a tournament.</p>
</div>

</div>


<!-- ADMIN REGISTER -->
<div class="card">

<h2>Admin Register Team</h2>

<label>Tournament ID</label>
<input id="adminTournamentId" placeholder="TNT_xxxxx">

<label>Team ID</label>
<input id="adminTeamId" placeholder="TEAM_xxxxx">

<button class="green" onclick="adminRegister()">
REGISTER TEAM
</button>

<div id="adminRegMsg" class="msg"></div>

</div>


<!-- CREATE GROUP -->
<div class="card">

<h2>Create Match Group</h2>

<label>Tournament ID</label>
<input id="gTournamentId" placeholder="TNT_xxxxx">

<label>Group Name</label>
<input id="gName" placeholder="GROUP 1">

<label>Room ID</label>
<input id="gRoomId" value="WAIT">

<label>Room Password</label>
<input id="gRoomPass" value="WAIT">

<label>Match Time</label>
<input id="gTime" placeholder="10 Aug, 8:00 PM">

<button class="green" onclick="createGroup()">
CREATE GROUP
</button>

<div id="gMsg" class="msg"></div>

</div>


<!-- ALL GROUPS -->
<div class="card">

<h2>Groups</h2>

<button class="gray" onclick="loadGroups()">
REFRESH GROUPS
</button>

<div id="groupsList">
<p class="muted">Loading...</p>
</div>

</div>


<!-- ASSIGN TEAM -->
<div class="card">

<h2>Assign Team To Group</h2>

<label>Group ID</label>
<input id="assignGroupId" placeholder="GRP_xxxxx">

<label>Team ID</label>
<input id="assignTeamId" placeholder="TEAM_xxxxx">

<button class="green" onclick="assignTeamToGroup()">
ASSIGN TEAM
</button>

<div id="assignMsg" class="msg"></div>

</div>


<!-- UPDATE ROOM -->
<div class="card">

<h2>Update Room</h2>

<label>Group ID</label>
<input id="uGroupId" placeholder="GRP_xxxxx">

<label>Room ID</label>
<input id="uRoomId" placeholder="123456">

<label>Room Password</label>
<input id="uRoomPass" placeholder="123456">

<button onclick="updateRoom()">
UPDATE ROOM
</button>

<div id="uMsg" class="msg"></div>

</div>


<!-- RESULTS -->
<div class="card">

<h2>Submit Result</h2>

<label>Tournament ID</label>
<input id="rTournamentId" placeholder="TNT_xxxxx">

<label>Group ID</label>
<input id="rGroupId" placeholder="GRP_xxxxx">

<label>Team ID</label>
<input id="rTeamId" placeholder="TEAM_xxxxx">

<label>Position</label>
<input id="rPosition" type="number" placeholder="1">

<label>Kills</label>
<input id="rKills" type="number" placeholder="5">

<label>Points</label>
<input id="rPoints" type="number" placeholder="12">

<button class="green" onclick="submitResult()">
SUBMIT RESULT
</button>

<div id="rMsg" class="msg"></div>

</div>

</div>


<script>

const API_URL="https://script.google.com/macros/s/AKfycbxjDkPM1foNGh76ieWGK-rq1_adN0jivaihhqwcORVtQsWstQcqE8dImABn6lyGJFBYCA/exec";

const ADMIN_EMAIL="vlogabhijeet030@gmail.com";

const MAX_TEAMS=12;


async function callAPI(action,data={}){

try{

const response=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
action:action,
adminEmail:ADMIN_EMAIL,
...data
})
});

const text=await response.text();

return JSON.parse(text);

}catch(error){

console.error(error);

return{
ok:false,
message:"API connection failed"
};

}

}


function showMsg(id,text,error=false){

const el=document.getElementById(id);

if(!el)return;

el.textContent=text;

el.className="msg "+(error?"error":"success");

}


function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* CREATE TOURNAMENT */

async function createTournament(){

const name=document.getElementById("tName").value.trim();

if(!name){

showMsg(
"tMsg",
"Tournament name required",
true
);

return;

}

const r=await callAPI("createTournament",{

name:name,

type:document.getElementById("tType").value,

entryFee:document.getElementById("tFee").value||"0",

prize:document.getElementById("tPrize").value||"0",

map:document.getElementById("tMap").value||"Bermuda",

matchTime:document.getElementById("tTime").value||"",

status:"upcoming",

registrationOpen:true

});


if(r.ok){

showMsg(
"tMsg",
"Tournament created • Registration OPEN • ID: "+r.tournamentId
);

document.getElementById("regTournamentId").value=r.tournamentId;

document.getElementById("adminTournamentId").value=r.tournamentId;

document.getElementById("gTournamentId").value=r.tournamentId;

document.getElementById("rTournamentId").value=r.tournamentId;

loadTournaments();

}else{

showMsg(
"tMsg",
r.message||"Failed",
true
);

}

}


/* LOAD TOURNAMENTS */

async function loadTournaments(){

const box=document.getElementById("tournamentList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await callAPI("getTournaments");

if(!r.ok){

box.innerHTML="<p class='muted'>Unable to load tournaments.</p>";

return;

}

const list=r.tournaments||[];

if(!list.length){

box.innerHTML="<p class='muted'>No tournaments.</p>";

return;

}


box.innerHTML=list.map(t=>{

const open=
t.registrationOpen===true||
String(t.registrationOpen).toLowerCase()==="true";


return`

<div class="item">

<b>${escapeHtml(t.name||"Tournament")}</b>

<div class="muted">
ID: ${escapeHtml(t.tournamentId)}
</div>

<div class="muted">
Entry: ${escapeHtml(t.entryFee||"FREE")}
•
Prize: ${escapeHtml(t.prize||"TBA")}
</div>

<div class="row">

<span class="status ${open?"open":"closed"}">
${open?"REGISTRATION OPEN":"REGISTRATION CLOSED"}
</span>

</div>

<div class="row">

<button class="smallbtn green"
onclick="setRegistration('${t.tournamentId}',true)">
OPEN
</button>

<button class="smallbtn red"
onclick="setRegistration('${t.tournamentId}',false)">
CLOSE
</button>

<button class="smallbtn gray"
onclick="selectTournament('${t.tournamentId}')">
SELECT
</button>

</div>

</div>

`;

}).join("");

}


/* SELECT TOURNAMENT */

function selectTournament(id){

document.getElementById("regTournamentId").value=id;

document.getElementById("adminTournamentId").value=id;

document.getElementById("gTournamentId").value=id;

document.getElementById("rTournamentId").value=id;

loadRegistrations();

}


/* REGISTRATION OPEN/CLOSE */

async function setRegistration(tournamentId,open){

const r=await callAPI("setRegistration",{

tournamentId:tournamentId,

registrationOpen:open

});

if(!r.ok){

alert(r.message||"Failed");

return;

}

alert(
open?
"Registration OPEN":
"Registration CLOSED"
);

loadTournaments();

loadRegistrations();

}


/* LOAD REGISTRATIONS */

async function loadRegistrations(){

const tournamentId=
document.getElementById("regTournamentId").value.trim();

if(!tournamentId){

alert("Tournament ID required");

return;

}

const box=document.getElementById("registrationList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await callAPI(
"getRegistrations",
{
tournamentId:tournamentId
}
);

if(!r.ok){

box.innerHTML="<p class='muted'>Unable to load registrations.</p>";

return;

}

const list=r.registrations||[];

const active=list.filter(x=>
x.status==="pending"||
x.status==="confirmed"
);

document.getElementById("slotCount").textContent=
active.length+" / "+MAX_TEAMS+" Teams";


if(!list.length){

box.innerHTML="<p class='muted'>No registrations yet.</p>";

return;

}


box.innerHTML=list.map(x=>`

<div class="item">

<b>Team: ${escapeHtml(x.teamId)}</b>

<div class="muted">
Registration: ${escapeHtml(x.registrationId)}
</div>

<div class="muted">
By: ${escapeHtml(x.registeredBy)}
</div>

<div class="row">

<span class="${escapeHtml(x.status)}">
${String(x.status).toUpperCase()}
</span>

${
x.status==="pending"
?
`
<div>

<button class="smallbtn green"
onclick="approve('${x.registrationId}')">
APPROVE
</button>

<button class="smallbtn red"
onclick="reject('${x.registrationId}')">
REJECT
</button>

</div>
`
:""
}

</div>

</div>

`).join("");

}


/* APPROVE */

async function approve(id){

const r=await callAPI(
"approveRegistration",
{
registrationId:id
}
);

alert(r.message||"Done");

if(r.ok)
loadRegistrations();

}


/* REJECT */

async function reject(id){

const r=await callAPI(
"rejectRegistration",
{
registrationId:id
}
);

alert(r.message||"Done");

if(r.ok)
loadRegistrations();

}


/* ADMIN REGISTER */

async function adminRegister(){

const tournamentId=
document.getElementById("adminTournamentId").value.trim();

const teamId=
document.getElementById("adminTeamId").value.trim();


if(!tournamentId||!teamId){

showMsg(
"adminRegMsg",
"Tournament ID and Team ID required",
true
);

return;

}


const r=await callAPI(
"adminRegisterTeam",
{
tournamentId:tournamentId,
teamId:teamId
}
);


showMsg(
"adminRegMsg",
r.message||"Done",
!r.ok
);


if(r.ok){

document.getElementById("regTournamentId").value=
tournamentId;

loadRegistrations();

}

}


/* CREATE GROUP */

async function createGroup(){

const tournamentId=
document.getElementById("gTournamentId").value.trim();

const groupName=
document.getElementById("gName").value.trim();


if(!tournamentId||!groupName){

showMsg(
"gMsg",
"Tournament ID and Group Name required",
true
);

return;

}


const r=await callAPI(
"createGroup",
{

tournamentId:tournamentId,

groupName:groupName,

roomId:
document.getElementById("gRoomId").value||"WAIT",

roomPassword:
document.getElementById("gRoomPass").value||"WAIT",

roomStatus:"waiting",

matchTime:
document.getElementById("gTime").value||""

}
);


showMsg(
"gMsg",
r.ok?
"Group created • ID: "+r.groupId:
r.message||"Failed",
!r.ok
);


if(r.ok){

document.getElementById("rGroupId").value=
r.groupId;

document.getElementById("uGroupId").value=
r.groupId;

document.getElementById("assignGroupId").value=
r.groupId;

loadGroups();

}

}


/* LOAD GROUPS */

async function loadGroups(){

const box=document.getElementById("groupsList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await callAPI("getGroups");


if(!r.ok){

box.innerHTML="<p class='muted'>Unable to load groups.</p>";

return;

}


const list=r.groups||[];


if(!list.length){

box.innerHTML="<p class='muted'>No groups yet.</p>";

return;

}


box.innerHTML=list.map(g=>`

<div class="item">

<b>${escapeHtml(g.groupName||"Group")}</b>

<div class="muted">
Group ID: ${escapeHtml(g.groupId)}
</div>

<div>
Room: ${escapeHtml(g.roomId||"WAIT")}
</div>

<div>
Password: ${escapeHtml(g.roomPassword||"WAIT")}
</div>

<div>
Time: ${escapeHtml(g.matchTime||"TBA")}
</div>

<div class="row">

<button class="smallbtn green"
onclick="selectGroup('${escapeHtml(g.groupId)}')">
SELECT
</button>

</div>

<a
href="match-room.html?id=${encodeURIComponent(g.groupId)}"
target="_blank"
style="display:block;margin-top:8px;color:#60a5fa">
Open Match Room →
</a>

</div>

`).join("");

}


/* SELECT GROUP */

function selectGroup(groupId){

document.getElementById("assignGroupId").value=
groupId;

document.getElementById("uGroupId").value=
groupId;

document.getElementById("rGroupId").value=
groupId;

document.getElementById("assignTeamId").focus();

}


/* ASSIGN TEAM */

async function assignTeamToGroup(){

const groupId=
document.getElementById("assignGroupId").value.trim();

const teamId=
document.getElementById("assignTeamId").value.trim();


if(!groupId||!teamId){

showMsg(
"assignMsg",
"Group ID and Team ID required",
true
);

return;

}


const r=await callAPI(
"assignTeamToGroup",
{

groupId:groupId,

teamId:teamId

}
);


showMsg(
"assignMsg",
r.message||"Done",
!r.ok
);


if(r.ok){

document.getElementById("assignTeamId").value="";

loadGroups();

}

}


/* UPDATE ROOM */

async function updateRoom(){

const groupId=
document.getElementById("uGroupId").value.trim();


if(!groupId){

showMsg(
"uMsg",
"Group ID required",
true
);

return;

}


const r=await callAPI(
"updateRoom",
{

groupId:groupId,

roomId:
document.getElementById("uRoomId").value,

roomPassword:
document.getElementById("uRoomPass").value

}
);


showMsg(
"uMsg",
r.message||"Done",
!r.ok
);


if(r.ok)
loadGroups();

}


/* SUBMIT RESULT */

async function submitResult(){

const tournamentId=
document.getElementById("rTournamentId").value.trim();

const groupId=
document.getElementById("rGroupId").value.trim();

const teamId=
document.getElementById("rTeamId").value.trim();


if(!tournamentId||!groupId||!teamId){

showMsg(
"rMsg",
"Tournament ID, Group ID and Team ID required",
true
);

return;

}


const r=await callAPI(
"submitResult",
{

tournamentId:tournamentId,

groupId:groupId,

teamId:teamId,

position:
document.getElementById("rPosition").value,

kills:
document.getElementById("rKills").value,

points:
document.getElementById("rPoints").value

}
);


showMsg(
"rMsg",
r.message||"Done",
!r.ok
);

}


/* START */

loadTournaments();

loadGroups();

</script>

</body>
</html>
