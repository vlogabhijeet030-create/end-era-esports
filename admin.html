<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>END ERA Admin</title>

<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#080c14;color:#e5e7eb;padding:16px}
.container{max-width:650px;margin:auto}
h1{font-size:24px;margin:0}
h2{font-size:17px;color:#38bdf8;margin:0 0 14px}
.subtitle,.muted{color:#94a3b8;font-size:13px}
.card{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:16px;margin:15px 0}
label{display:block;font-size:12px;color:#94a3b8;margin:10px 0 5px}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #263244;background:#0b1220;color:#fff}
button{width:100%;padding:11px;margin-top:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700}
.green{background:#16a34a}
.red{background:#dc2626}
.gray{background:#334155}
.yellow{background:#ca8a04}
.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.success{background:#14532d;color:#86efac}
.error{background:#450a0a;color:#fca5a5}
.item{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.small{width:auto;margin:0;padding:8px 12px;font-size:12px}
.slot{font-size:20px;font-weight:800;margin:10px 0}
.open{color:#4ade80;font-weight:700}
.closed{color:#f87171;font-weight:700}
.pending{color:#facc15;font-weight:700}
.confirmed{color:#4ade80;font-weight:700}
.rejected{color:#f87171;font-weight:700}
.team{padding:10px;border:1px solid #263244;border-radius:8px;margin-top:7px}
</style>
</head>

<body>

<div class="container">

<h1>END ERA Admin</h1>
<p class="subtitle">Tournament • Registration • Group • Team • Room Control</p>

<!-- CREATE TOURNAMENT -->
<div class="card">
<h2>Create Tournament</h2>

<label>Name</label>
<input id="tName" placeholder="END ERA SCRIM">

<label>Type</label>
<select id="tType">
<option>Scrim</option>
<option>Tournament</option>
<option>Custom</option>
</select>

<label>Entry Fee</label>
<input id="tFee" placeholder="10">

<label>Prize</label>
<input id="tPrize" placeholder="120">

<label>Map</label>
<input id="tMap" placeholder="Bermuda">

<label>Match Time</label>
<input id="tTime" placeholder="10 Aug, 8:00 PM">

<button onclick="createTournament()">CREATE TOURNAMENT</button>
<div id="tMsg"></div>
</div>

<!-- TOURNAMENTS -->
<div class="card">
<h2>Tournaments</h2>

<button class="gray" onclick="loadTournaments()">REFRESH</button>

<div id="tournamentList">
<p class="muted">Loading...</p>
</div>
</div>

<!-- REGISTRATIONS -->
<div class="card">
<h2>Team Registrations</h2>

<label>Tournament ID</label>
<input id="regTournamentId" placeholder="TNT_xxxxx">

<button onclick="loadRegistrations()">LOAD REGISTRATIONS</button>

<div id="slotCount" class="slot">0 / 12 Teams</div>

<div id="registrationList">
<p class="muted">No tournament selected.</p>
</div>
</div>

<!-- ADMIN REGISTER -->
<div class="card">
<h2>Admin Register Team</h2>

<label>Tournament ID</label>
<input id="adminTournamentId" placeholder="TNT_xxxxx">

<label>Team ID</label>
<input id="adminTeamId" placeholder="TEAM_xxxxx">

<button class="green" onclick="adminRegister()">REGISTER TEAM</button>

<div id="adminMsg"></div>
</div>

<!-- CREATE GROUP -->
<div class="card">
<h2>Create Match Group</h2>

<label>Tournament ID</label>
<input id="gTournamentId" placeholder="TNT_xxxxx">

<label>Group Name</label>
<input id="gName" placeholder="GROUP 1">

<label>Room ID</label>
<input id="gRoomId" value="WAIT">

<label>Room Password</label>
<input id="gRoomPass" value="WAIT">

<label>Match Time</label>
<input id="gTime" placeholder="10 Aug, 8:00 PM">

<button class="green" onclick="createGroup()">CREATE GROUP</button>

<div id="gMsg"></div>
</div>

<!-- TEAM ASSIGNMENT -->
<div class="card">
<h2>Assign Team To Group</h2>

<label>Group ID</label>
<input id="assignGroupId" placeholder="GRP_xxxxx">

<label>Team ID</label>
<input id="assignTeamId" placeholder="TEAM_xxxxx">

<button class="yellow" onclick="assignTeam()">ASSIGN TEAM</button>

<div id="assignMsg"></div>

<div id="assignedTeams"></div>
</div>

<!-- ROOM -->
<div class="card">
<h2>Update Room</h2>

<label>Group ID</label>
<input id="uGroupId" placeholder="GRP_xxxxx">

<label>Room ID</label>
<input id="uRoomId" placeholder="123456">

<label>Room Password</label>
<input id="uRoomPass" placeholder="123456">

<button onclick="updateRoom()">UPDATE ROOM</button>

<div id="uMsg"></div>
</div>

<!-- GROUPS -->
<div class="card">
<h2>Groups</h2>

<button class="gray" onclick="loadGroups()">REFRESH GROUPS</button>

<div id="groupsList">
<p class="muted">Loading...</p>
</div>
</div>

<!-- RESULTS -->
<div class="card">
<h2>Submit Result</h2>

<label>Tournament ID</label>
<input id="rTournamentId" placeholder="TNT_xxxxx">

<label>Group ID</label>
<input id="rGroupId" placeholder="GRP_xxxxx">

<label>Team ID</label>
<input id="rTeamId" placeholder="TEAM_xxxxx">

<label>Position</label>
<input id="rPosition" type="number" placeholder="1">

<label>Kills</label>
<input id="rKills" type="number" placeholder="5">

<label>Points</label>
<input id="rPoints" type="number" placeholder="12">

<button class="green" onclick="submitResult()">SUBMIT RESULT</button>

<div id="rMsg"></div>
</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbxjDkPM1foNGh76ieWGK-rq1_adN0jivaihhqwcORVtQsWstQcqE8dImABn6lyGJFBYCA/exec";

const ADMIN_EMAIL="vlogabhijeet030@gmail.com";

const MAX_TEAMS=12;

async function api(action,data={}){

try{

const r=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({
action:action,
adminEmail:ADMIN_EMAIL,
...data
})
});

return await r.json();

}catch(e){

return{
ok:false,
message:"API connection failed"
};

}
}

function msg(id,text,error=false){

const x=document.getElementById(id);

if(!x)return;

x.textContent=text;
x.className=error?"msg error":"msg success";

}

function esc(x){

return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* TOURNAMENT */

async function createTournament(){

const name=document.getElementById("tName").value.trim();

if(!name){

msg("tMsg","Tournament name required",true);
return;

}

const r=await api("createTournament",{

name:name,
type:document.getElementById("tType").value,
entryFee:document.getElementById("tFee").value||"0",
prize:document.getElementById("tPrize").value||"0",
map:document.getElementById("tMap").value||"Bermuda",
matchTime:document.getElementById("tTime").value||"",
status:"upcoming"

});

if(r.ok){

msg("tMsg","Created • ID: "+r.tournamentId);

document.getElementById("regTournamentId").value=r.tournamentId;
document.getElementById("adminTournamentId").value=r.tournamentId;
document.getElementById("gTournamentId").value=r.tournamentId;
document.getElementById("rTournamentId").value=r.tournamentId;

loadTournaments();

}else{

msg("tMsg",r.message||"Failed",true);

}

}

async function loadTournaments(){

const box=document.getElementById("tournamentList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await api("getTournaments");

if(!r.ok){

box.innerHTML="<p class='muted'>Failed.</p>";
return;

}

const list=r.tournaments||[];

if(!list.length){

box.innerHTML="<p class='muted'>No tournaments.</p>";
return;

}

box.innerHTML=list.map(t=>{

const open=
t.registrationOpen===true||
String(t.registrationOpen).toLowerCase()==="true";

return`

<div class="item">

<b>${esc(t.name)}</b>

<p class="muted">
ID: ${esc(t.tournamentId)}
</p>

<p class="muted">
Entry: ${esc(t.entryFee)} • Prize: ${esc(t.prize)}
</p>

<div class="${open?"open":"closed"}">
${open?"REGISTRATION OPEN":"REGISTRATION CLOSED"}
</div>

<div class="row">

<button class="small green"
onclick="setReg('${esc(t.tournamentId)}',true)">
OPEN
</button>

<button class="small red"
onclick="setReg('${esc(t.tournamentId)}',false)">
CLOSE
</button>

<button class="small gray"
onclick="selectTournament('${esc(t.tournamentId)}')">
SELECT
</button>

</div>

</div>

`;

}).join("");

}

function selectTournament(id){

document.getElementById("regTournamentId").value=id;
document.getElementById("adminTournamentId").value=id;
document.getElementById("gTournamentId").value=id;
document.getElementById("rTournamentId").value=id;

loadRegistrations();

}

async function setReg(id,open){

const r=await api("setRegistration",{
tournamentId:id,
registrationOpen:open
});

alert(r.message||"Done");

if(r.ok){

loadTournaments();
loadRegistrations();

}

}

/* REGISTRATIONS */

async function loadRegistrations(){

const id=document.getElementById("regTournamentId").value.trim();

if(!id){

alert("Tournament ID required");
return;

}

const box=document.getElementById("registrationList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await api("getRegistrations",{
tournamentId:id
});

if(!r.ok){

box.innerHTML="<p class='muted'>Failed.</p>";
return;

}

const list=r.registrations||[];

const active=list.filter(x=>
x.status==="pending"||
x.status==="confirmed"
);

document.getElementById("slotCount").textContent=
active.length+" / "+MAX_TEAMS+" Teams";

if(!list.length){

box.innerHTML="<p class='muted'>No registrations.</p>";
return;

}

box.innerHTML=list.map(x=>`

<div class="item">

<b>TEAM: ${esc(x.teamId)}</b>

<p class="muted">
REG ID: ${esc(x.registrationId)}
</p>

<p class="${esc(x.status)}">
${String(x.status).toUpperCase()}
</p>

${
x.status==="pending"
?
`
<div class="row">

<button class="small green"
onclick="approve('${esc(x.registrationId)}')">
APPROVE
</button>

<button class="small red"
onclick="reject('${esc(x.registrationId)}')">
REJECT
</button>

</div>
`
:""
}

</div>

`).join("");

}

async function approve(id){

const r=await api("approveRegistration",{
registrationId:id
});

alert(r.message||"Done");

if(r.ok)loadRegistrations();

}

async function reject(id){

const r=await api("rejectRegistration",{
registrationId:id
});

alert(r.message||"Done");

if(r.ok)loadRegistrations();

}

/* ADMIN REGISTER */

async function adminRegister(){

const tournamentId=
document.getElementById("adminTournamentId").value.trim();

const teamId=
document.getElementById("adminTeamId").value.trim();

if(!tournamentId||!teamId){

msg("adminMsg","Tournament ID and Team ID required",true);
return;

}

const r=await api("adminRegisterTeam",{
tournamentId:tournamentId,
teamId:teamId
});

msg("adminMsg",r.message||"Done",!r.ok);

if(r.ok){

document.getElementById("regTournamentId").value=tournamentId;

loadRegistrations();

}

}

/* GROUP */

async function createGroup(){

const tournamentId=
document.getElementById("gTournamentId").value.trim();

const groupName=
document.getElementById("gName").value.trim();

if(!tournamentId||!groupName){

msg("gMsg","Tournament ID and Group Name required",true);
return;

}

const r=await api("createGroup",{

tournamentId:tournamentId,
groupName:groupName,

roomId:
document.getElementById("gRoomId").value||"WAIT",

roomPassword:
document.getElementById("gRoomPass").value||"WAIT",

roomStatus:"waiting",

matchTime:
document.getElementById("gTime").value||""

});

msg(
"gMsg",
r.ok?"Group created • ID: "+r.groupId:r.message||"Failed",
!r.ok
);

if(r.ok){

document.getElementById("assignGroupId").value=r.groupId;
document.getElementById("uGroupId").value=r.groupId;
document.getElementById("rGroupId").value=r.groupId;

loadGroups();

}

}

/* TEAM ASSIGN */

async function assignTeam(){

const groupId=
document.getElementById("assignGroupId").value.trim();

const teamId=
document.getElementById("assignTeamId").value.trim();

if(!groupId||!teamId){

msg("assignMsg","Group ID and Team ID required",true);
return;

}

/*
NOTE:
Ye function backend ke assignTeamToGroup action ko call karega.
*/

const r=await api("assignTeamToGroup",{

groupId:groupId,
teamId:teamId

});

msg(
"assignMsg",
r.message||"Done",
!r.ok
);

if(r.ok){

document.getElementById("assignTeamId").value="";

loadGroups();

}

}

/* ROOM */

async function updateRoom(){

const groupId=
document.getElementById("uGroupId").value.trim();

if(!groupId){

msg("uMsg","Group ID required",true);
return;

}

const r=await api("updateRoom",{

groupId:groupId,

roomId:
document.getElementById("uRoomId").value,

roomPassword:
document.getElementById("uRoomPass").value,

roomStatus:"open"

});

msg(
"uMsg",
r.message||"Done",
!r.ok
);

if(r.ok)loadGroups();

}

/* GROUP LIST */

async function loadGroups(){

const box=document.getElementById("groupsList");

box.innerHTML="<p class='muted'>Loading...</p>";

const r=await api("getGroups");

if(!r.ok){

box.innerHTML="<p class='muted'>Failed.</p>";
return;

}

const list=r.groups||[];

if(!list.length){

box.innerHTML="<p class='muted'>No groups.</p>";
return;

}

box.innerHTML=list.map(g=>`

<div class="item">

<b>${esc(g.groupName)}</b>

<p class="muted">
Group ID: ${esc(g.groupId)}
</p>

<p>
Room: ${esc(g.roomId||"WAIT")}
</p>

<p>
Password: ${esc(g.roomPassword||"WAIT")}
</p>

<p class="muted">
Time: ${esc(g.matchTime||"TBA")}
</p>

<div class="row">

<button class="small yellow"
onclick="selectGroup('${esc(g.groupId)}')">
USE GROUP
</button>

<a
class="small"
style="display:block;background:#334155;color:white;text-decoration:none;border-radius:8px;padding:8px 12px"
href="match-room.html?id=${encodeURIComponent(g.groupId)}"
target="_blank">
ROOM
</a>

</div>

</div>

`).join("");

}

function selectGroup(id){

document.getElementById("assignGroupId").value=id;
document.getElementById("uGroupId").value=id;
document.getElementById("rGroupId").value=id;

}

/* RESULT */

async function submitResult(){

const tournamentId=
document.getElementById("rTournamentId").value.trim();

const groupId=
document.getElementById("rGroupId").value.trim();

const teamId=
document.getElementById("rTeamId").value.trim();

if(!tournamentId||!groupId||!teamId){

msg("rMsg","Tournament ID, Group ID and Team ID required",true);
return;

}

const r=await api("submitResult",{

tournamentId:tournamentId,
groupId:groupId,
teamId:teamId,

position:
document.getElementById("rPosition").value,

kills:
document.getElementById("rKills").value,

points:
document.getElementById("rPoints").value

});

msg(
"rMsg",
r.message||"Done",
!r.ok
);

}

loadTournaments();
loadGroups();

</script>

</body>
</html>
