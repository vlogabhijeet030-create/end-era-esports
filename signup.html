<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account • END ERA eSports</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<a class="logo" href="index.html">
END ERA <small>eSports</small>
</a>

<nav>
<a href="index.html">Home</a>
<a href="tournaments.html">Tournaments</a>
<a href="scrims.html">Scrims</a>
<a href="results.html">Results</a>
</nav>
</header>

<main class="auth">

<form class="panel" onsubmit="signup(event)">

<p class="gold">ACCOUNT</p>
<h1>CREATE ACCOUNT</h1>

<label>
Name
<input id="name" type="text" placeholder="Your name" required>
</label>

<label>
Email
<input id="email" type="email" placeholder="Your email" required>
</label>

<label>
Phone
<input id="phone" type="tel" placeholder="Mobile number">
</label>

<label>
Password
<input id="password" type="password" placeholder="Create password" required>
</label>

<button class="btn full" type="submit">
CREATE ACCOUNT
</button>

<p class="muted">
Already have an account?
<a href="login.html">Login</a>
</p>

</form>

</main>

<script src="app.js"></script>

</body>
</html>
