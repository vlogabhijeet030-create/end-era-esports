<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Match Room - END ERA eSports</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',system-ui,sans-serif;
}

body{
  background:#0b0f19;
  color:#e2e8f0;
  min-height:100vh;
  padding:16px;
}

.container{
  max-width:480px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:24px;
  padding-top:10px;
}

.header h1{
  font-size:22px;
  font-weight:700;
  color:#fff;
  letter-spacing:1px;
}

.header p{
  color:#94a3b8;
  font-size:13px;
  margin-top:4px;
}

.card{
  background:#111827;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

.card-title{
  font-size:13px;
  color:#94a3b8;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:12px;
  font-weight:600;
}

.lobby-box{
  background:#0f172a;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lobby-label{
  font-size:12px;
  color:#64748b;
  margin-bottom:4px;
}

.lobby-value{
  font-size:18px;
  font-weight:700;
  color:#38bdf8;
  letter-spacing:1px;
}

.copy-btn{
  background:#1e293b;
  border:none;
  color:#e2e8f0;
  padding:8px 14px;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
  font-weight:600;
}

.status{
  display:inline-block;
  background:#14532d;
  color:#4ade80;
  font-size:12px;
  padding:4px 10px;
  border-radius:20px;
  font-weight:600;
  margin-bottom:16px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #1e293b;
  font-size:14px;
}

.info-row:last-child{
  border-bottom:none;
}

.info-label{
  color:#94a3b8;
}

.info-value{
  color:#f1f5f9;
  font-weight:600;
  text-align:right;
}

.team-name{
  color:#38bdf8;
  font-weight:700;
}

.slot-number{
  color:#fbbf24;
  font-weight:700;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th{
  text-align:left;
  color:#64748b;
  padding:8px 4px;
  font-weight:600;
  border-bottom:1px solid #1e293b;
}

td{
  padding:10px 4px;
  border-bottom:1px solid #1e293b;
}

tr:last-child td{
  border-bottom:none;
}

.rank{
  font-weight:700;
  color:#fbbf24;
}

.loading{
  text-align:center;
  padding:40px 20px;
  color:#64748b;
}

.error{
  background:#450a0a;
  color:#fca5a5;
  padding:16px;
  border-radius:12px;
  text-align:center;
  margin:20px 0;
}

.whatsapp-btn{
  display:block;
  background:#16a34a;
  color:white;
  text-align:center;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  margin-top:8px;
}

.proof-box{
  background:#0f172a;
  border:1px solid #1e293b;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
}

.proof-title{
  color:#38bdf8;
  font-weight:700;
  margin-bottom:6px;
}

.proof-text{
  color:#94a3b8;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>END ERA eSports</h1>
    <p>MATCH ROOM</p>
  </div>

  <div id="content">
    <div class="loading">Loading match data...</div>
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxjDkPM1foNGh76ieWGK-rq1_adN0jivaihhqwcORVtQsWstQcqE8dImABn6lyGJFBYCA/exec";

const urlParams = new URLSearchParams(window.location.search);
const groupId = urlParams.get("id");

async function callAPI(action,data={}){

  const res = await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify({
      action,
      ...data
    }),
    redirect:"follow"
  });

  const text = await res.text();

  if(!text || text.trim().startsWith("<!")){
    throw new Error("API error");
  }

  return JSON.parse(text);
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function copyText(text){

  if(!text){
    alert("Nothing to copy");
    return;
  }

  navigator.clipboard.writeText(String(text))
    .then(()=>{
      alert("Copied: " + text);
    })
    .catch(()=>{
      alert("Copy failed");
    });
}


/*
  IMPORTANT:
  Get actual team name from Teams sheet using teamId.
*/

async function getTeamName(teamId){

  if(!teamId){
    return "Unknown Team";
  }

  try{

    const r = await callAPI("getTeam",{
      teamId:teamId
    });

    if(r.ok && r.team){

      return r.team.teamName || teamId;

    }

  }catch(e){

    console.log("Team lookup failed:",teamId);

  }

  return teamId;
}


/*
  Convert registrations into:
  {
    teamId,
    teamName,
    ...
  }
*/

async function addTeamNames(registrations){

  return await Promise.all(

    registrations.map(async r=>{

      const teamName = await getTeamName(r.teamId);

      return {
        ...r,
        teamName:teamName
      };

    })

  );

}


/*
  Add team names to points table too.
*/

async function addPointsTeamNames(pointsTable){

  return await Promise.all(

    pointsTable.map(async t=>{

      const teamName = await getTeamName(t.teamId);

      return {
        ...t,
        teamName:teamName
      };

    })

  );

}


async function loadMatchRoom(){

  const content = document.getElementById("content");

  if(!groupId){

    content.innerHTML = `
      <div class="error">
        Invalid Match Room.<br>
        Group ID missing.
      </div>
    `;

    return;
  }

  try{

    /*
      GET GROUP
    */

    const groupRes = await callAPI("getGroup",{
      groupId:groupId
    });

    if(!groupRes.ok){

      content.innerHTML = `
        <div class="error">
          ${escapeHtml(groupRes.message || "Group not found")}
        </div>
      `;

      return;
    }

    const group = groupRes.group;


    /*
      GET POINTS
    */

    const pointsRes = await callAPI(
      "getPointsTable",
      {
        groupId:groupId
      }
    );

    let pointsTable =
      pointsRes.ok
      ? (pointsRes.pointsTable || [])
      : [];


    /*
      GET REGISTRATIONS
    */

    const regRes = await callAPI(
      "getRegistrations",
      {
        tournamentId:group.tournamentId
      }
    );

    let registrations =
      regRes.ok
      ? (regRes.registrations || [])
      : [];


    /*
      Only confirmed/pending registrations.
      Rejected teams won't show.
    */

    registrations = registrations.filter(r=>
      String(r.status).toLowerCase()==="confirmed" ||
      String(r.status).toLowerCase()==="pending"
    );


    /*
      GET TEAM NAMES
    */

    registrations =
      await addTeamNames(registrations);

    pointsTable =
      await addPointsTeamNames(pointsTable);


    /*
      Sort registrations by registration time.
    */

    registrations.sort((a,b)=>{

      const aTime =
        new Date(a.registeredAt || 0).getTime();

      const bTime =
        new Date(b.registeredAt || 0).getTime();

      return aTime-bTime;

    });


    /*
      MAIN CONTENT
    */

    let html = `

      <div class="status">
        ${escapeHtml(
          String(group.roomStatus || "WAITING").toUpperCase()
        )}
      </div>


      <!-- ROOM -->

      <div class="card">

        <div class="card-title">
          Lobby Credentials
        </div>

        <div class="lobby-box">

          <div>

            <div class="lobby-label">
              Room ID
            </div>

            <div class="lobby-value">
              ${escapeHtml(group.roomId || "WAIT")}
            </div>

          </div>

          <button
            class="copy-btn"
            onclick="copyText('${escapeHtml(group.roomId || "")}')">
            COPY
          </button>

        </div>


        <div class="lobby-box">

          <div>

            <div class="lobby-label">
              Password
            </div>

            <div class="lobby-value">
              ${escapeHtml(group.roomPassword || "WAIT")}
            </div>

          </div>

          <button
            class="copy-btn"
            onclick="copyText('${escapeHtml(group.roomPassword || "")}')">
            COPY
          </button>

        </div>

      </div>


      <!-- MATCH INFO -->

      <div class="card">

        <div class="card-title">
          Match Info
        </div>

        <div class="info-row">

          <span class="info-label">
            Group
          </span>

          <span class="info-value">
            ${escapeHtml(group.groupName || "-")}
          </span>

        </div>


        <div class="info-row">

          <span class="info-label">
            Match Time
          </span>

          <span class="info-value">
            ${escapeHtml(group.matchTime || "--")}
          </span>

        </div>

      </div>

    `;


    /*
      POINTS TABLE
    */

    html += `

      <div class="card">

        <div class="card-title">
          Points Table
        </div>

        ${
          pointsTable.length === 0

          ?

          `
          <div style="
            color:#64748b;
            font-size:14px;
            padding:10px 0;
          ">
            Waiting for results...
          </div>
          `

          :

          `
          <table>

            <thead>

              <tr>
                <th>#</th>
                <th>Team</th>
                <th>Pts</th>
                <th>Kills</th>
              </tr>

            </thead>

            <tbody>

              ${
                pointsTable.map((t,i)=>`

                  <tr>

                    <td class="rank">
                      ${i+1}
                    </td>

                    <td class="team-name">
                      ${escapeHtml(
                        t.teamName || t.teamId
                      )}
                    </td>

                    <td>
                      ${escapeHtml(t.totalPoints || 0)}
                    </td>

                    <td>
                      ${escapeHtml(t.totalKills || 0)}
                    </td>

                  </tr>

                `).join("")
              }

            </tbody>

          </table>
          `
        }

      </div>

    `;


    /*
      PARTICIPATING TEAMS
    */

    html += `

      <div class="card">

        <div class="card-title">
          Participating Teams
        </div>

        ${
          registrations.length === 0

          ?

          `
          <div style="
            color:#64748b;
            font-size:14px;
          ">
            No teams yet.
          </div>
          `

          :

          registrations.map((r,i)=>`

            <div class="info-row">

              <span class="info-label">

                <span class="slot-number">
                  Slot ${i+1}
                </span>

              </span>

              <span class="info-value team-name">
                ${escapeHtml(
                  r.teamName || r.teamId
                )}
              </span>

            </div>

          `).join("")
        }

      </div>

    `;


    /*
      PROOFS SECTION
    */

    html += `

      <div class="card">

        <div class="card-title">
          Proofs
        </div>

        <div class="proof-box">

          <div class="proof-title">
            Match Proof
          </div>

          <div class="proof-text">
            Match screenshots and result proofs
            will be uploaded here after the match.
          </div>

        </div>

        <div class="proof-box">

          <div class="proof-title">
            Result Proof
          </div>

          <div class="proof-text">
            Official match result proof will be
            available after results are submitted.
          </div>

        </div>

      </div>

    `;


    /*
      WHATSAPP
    */

    html += `

      <a
        href="#"
        class="whatsapp-btn"
        onclick="
          alert('WhatsApp Channel link will be added.');
          return false;
        "
      >
        Join WhatsApp Channel
      </a>

    `;


    content.innerHTML = html;


  }catch(err){

    console.error(err);

    content.innerHTML = `

      <div class="error">

        Error loading match data.

        <br><br>

        ${escapeHtml(err.message)}

      </div>

    `;

  }

}


loadMatchRoom();

</script>

</body>
</html>
